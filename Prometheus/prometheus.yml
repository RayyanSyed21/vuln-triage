# Prometheus runs on the compose network, so it reaches the other containers
# by service name on their INTERNAL ports (8000, 9100), not the 14xx host ports.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: vuln-triage
    static_configs:
      - targets: ["api-product:8000"]
        labels: {product: api}
      - targets: ["local-product:8000"]
        labels: {product: local}

  - job_name: node
    static_configs:
      - targets: ["api-product:9100"]
        labels: {product: api}
      - targets: ["local-product:9100"]
        labels: {product: local}
