# CS3: one ngrok URL -> three services, routed by path.
# ngrok (free plan = one domain) forwards to host port 1408 -> this container's :80.
events {}

http {
  # Needed so Gradio's live updates (websockets / server-sent events) pass through.
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_buffering off;          # stream responses instead of holding them
  proxy_read_timeout 300s;      # local model can take a while on a busy CPU

  server {
    listen 80;

    # Trailing slash on proxy_pass strips the /api/ prefix before forwarding.
    location /api/     { proxy_pass http://api-product:7860/; }
    location /local/   { proxy_pass http://local-product:7860/; }
    # Grafana is configured to serve from /grafana/ itself, so keep the prefix.
    location /grafana/ { proxy_pass http://grafana:3000; }

    location = /api     { return 301 /api/; }
    location = /local   { return 301 /local/; }
    location = /grafana { return 301 /grafana/; }
    location = /        { return 302 /api/; }
  }
}
