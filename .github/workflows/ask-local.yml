name: Ask local model (manual)

on:
  workflow_dispatch:

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ask the local model
        run: python ask_local.py
