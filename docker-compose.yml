# CS3 Group 14 stack. Every host port is in our claimed block 1400-1409.
#   1400 api UI     1401 api app metrics     1402 api node-exporter
#   1403 local UI   1404 local app metrics   1405 local node-exporter
#   1406 prometheus 1407 grafana
# Run on the VM with:  docker compose up -d --build   (secrets come from .env)
name: group14

services:
  api-product:
    build: .
    image: group14/vuln-triage:latest
    container_name: group14-api
    environment:
      PRODUCT_MODE: remote
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in the shell or a .env file}
    ports: ["1400:7860", "1401:8000", "1402:9100"]
    restart: unless-stopped

  local-product:
    image: group14/vuln-triage:latest   # same image, different mode
    container_name: group14-local
    depends_on: [api-product]           # so the image is built once, first
    environment:
      PRODUCT_MODE: local
    ports: ["1403:7860", "1404:8000", "1405:9100"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: group14-prometheus
    volumes: ["./Prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["1406:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: group14-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
    volumes: ["./Grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["1407:3000"]
    restart: unless-stopped
