# CS3 Group 14 stack. Every host port is in our claimed block 1400-1409.
#   1400 api product UI      1401 api product /metrics
#   1402 local product UI    1403 local product /metrics
#   1404 node-exporter       1405 prometheus      1406 grafana
# Run on the VM with:  HF_TOKEN=hf_xxx docker compose up -d --build
name: group14

services:
  api-product:
    build: .
    image: group14/vuln-triage:latest
    environment:
      PRODUCT_MODE: remote
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in the shell or a .env file}
    ports: ["1400:7860", "1401:8000"]
    restart: unless-stopped

  local-product:
    image: group14/vuln-triage:latest   # same image, different mode
    depends_on: [api-product]           # so the image is built once, first
    environment:
      PRODUCT_MODE: local
    ports: ["1402:7860", "1403:8000"]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    ports: ["1404:9100"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./Prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["1405:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
    volumes: ["./Grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["1406:3000"]
    restart: unless-stopped
